<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultIQ - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">VaultIQ</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Dashboard</a></li>
                <li><a href="add-transaction.html">Add Transaction</a></li>
                <li><a href="transactions.html">Transactions</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1>Dashboard</h1>

        <div class="summary-cards">
            <div class="card card-income">
                <h3>Total Income</h3>
                <p id="totalIncome">₹0.00</p>
            </div>
            <div class="card card-expense">
                <h3>Total Expense</h3>
                <p id="totalExpense">₹0.00</p>
            </div>
            <div class="card card-balance">
                <h3>Balance</h3>
                <p id="balance">₹0.00</p>
            </div>
        </div>

        <section class="recent-transactions">
            <h2>Recent Transactions</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody id="recentTbody">
                    <tr><td colspan="5" class="text-center">No transactions yet.</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 VaultIQ. Built by Bhavini Awasthi</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>loadDashboard();</script>
</body>
</html>
