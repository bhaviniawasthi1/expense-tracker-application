<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultIQ - Add Transaction</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">VaultIQ</a>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="add-transaction.html" class="active">Add Transaction</a></li>
                <li><a href="transactions.html">Transactions</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1>Add Transaction</h1>

        <form id="transactionForm" class="transaction-form">
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" required placeholder="e.g. Grocery shopping">
            </div>

            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0.01" required placeholder="e.g. 500">
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" name="type" required>
                    <option value="EXPENSE">Expense</option>
                    <option value="INCOME">Income</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="categoryId" required>
                    <option value="">-- Select Category --</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Add Transaction</button>
        </form>

        <div id="formMessage" class="form-message"></div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 VaultIQ. Built by Bhavini Awasthi</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>initAddTransaction();</script>
</body>
</html>
